<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>HSK1 Flashcards (Pleco JSON)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #f8fafc;
      padding: 40px;
    }
    .card {
      margin: auto;
      width: 260px;
      height: 200px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      transition: transform 0.4s;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .hanzi {
      font-size: 4rem;
    }
    .pinyin {
      font-size: 1.5rem;
      color: #0078D7;
      display: none;
    }
    .meaning {
      font-size: 1rem;
      color: #555;
      display: none;
    }
    .buttons {
      margin-top: 20px;
    }
    button {
      margin: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #0078D7;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <h2>🈶 HSK 1 Flashcards</h2>
  <div class="card" id="card">
    <div class="hanzi" id="hanzi">加载中...</div>
    <div class="pinyin" id="pinyin"></div>
    <div class="meaning" id="meaning"></div>
  </div>
  <div class="buttons">
    <button id="prev">⏮ Anterior</button>
    <button id="show">👁 Mostrar</button>
    <button id="next">⏭ Siguiente</button>
  </div>

  <script>
  let cards = [];
  let index = 0;
  const hanziEl = document.getElementById('hanzi');
  const pinyinEl = document.getElementById('pinyin');
  const meaningEl = document.getElementById('meaning');

  async function loadCards() {
    const res = await fetch('hsk1.json');
    const data = await res.json();
    cards = data.plecoflash.cards.card.map(item => {
      let word;
      // Algunos tienen headword como array (simplificado + tradicional)
      if (Array.isArray(item.entry.headword)) {
        // preferimos el simplificado
        word = item.entry.headword.find(h => h._charset === "sc")?.__text || item.entry.headword[0].__text;
      } else {
        word = item.entry.headword;
      }
      return {
        hanzi: word,
        pinyin: item.entry.pron.__text,
        meaning: item.entry.defn
      };
    });
    showCard();
  }

  function showCard() {
    const card = cards[index];
    hanziEl.textContent = card.hanzi;
    pinyinEl.textContent = card.pinyin;
    meaningEl.textContent = card.meaning;
    pinyinEl.style.display = 'none';
    meaningEl.style.display = 'none';
  }

  document.getElementById('show').onclick = () => {
    pinyinEl.style.display = 'block';
    meaningEl.style.display = 'block';
  };
  document.getElementById('next').onclick = () => {
    index = (index + 1) % cards.length;
    showCard();
  };
  document.getElementById('prev').onclick = () => {
    index = (index - 1 + cards.length) % cards.length;
    showCard();
  };

  loadCards();
  </script>
</body>
</html>
