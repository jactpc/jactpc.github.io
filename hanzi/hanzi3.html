<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>HSK1 Flashcards Aleatorias</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #f8fafc;
      padding: 40px;
    }
    .card {
      margin: auto;
      width: 260px;
      height: 250px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      transition: transform 0.4s;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .hanzi {
      font-size: 4rem;
    }
    .pinyin {
      font-size: 1.5rem;
      color: #0078D7;
      display: none;
    }
    .meaning {
      font-size: 1rem;
      color: #555;
      display: none;
    }
    .example {
      font-size: 1rem;
      color: #333;
      display: none;
      margin-top: 10px;
    }
    .buttons {
      margin-top: 20px;
    }
    button {
      margin: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #0078D7;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <h2>🈶 HSK 1 Flashcards Aleatorias</h2>
  <div class="card" id="card">
    <div class="hanzi" id="hanzi">加载中...</div>
    <div class="pinyin" id="pinyin"></div>
    <div class="meaning" id="meaning"></div>
    <div class="example" id="example"></div>
  </div>
  <div class="buttons">
    <button id="show">👁 Mostrar</button>
    <button id="next">⏭ Siguiente</button>
  </div>

  <script>
  let cards = [];
  let currentCard = {};

  async function loadCards() {
    const res = await fetch('hsk1.json');
    const data = await res.json();
    cards = data.plecoflash.cards.card.map(item => {
      let word;
      if (Array.isArray(item.entry.headword)) {
        word = item.entry.headword.find(h => h._charset === "sc")?.__text || item.entry.headword[0].__text;
      } else {
        word = item.entry.headword;
      }
      return {
        hanzi: word,
        pinyin: item.entry.pron.__text,
        meaning: item.entry.defn,
        example: item.entry.example
      };
    });
    showRandomCard();
  }

  function showRandomCard() {
    const randomIndex = Math.floor(Math.random() * cards.length);
    currentCard = cards[randomIndex];
    document.getElementById('hanzi').textContent = currentCard.hanzi;
    document.getElementById('pinyin').textContent = currentCard.pinyin;
    document.getElementById('meaning').textContent = currentCard.meaning;
    document.getElementById('example').textContent = currentCard.example;
    document.getElementById('pinyin').style.display = 'none';
    document.getElementById('meaning').style.display = 'none';
    document.getElementById('example').style.display = 'none';
  }

  document.getElementById('show').onclick = () => {
    document.getElementById('pinyin').style.display = 'block';
    document.getElementById('meaning').style.display = 'block';
    document.getElementById('example').style.display = 'block';
  };

  document.getElementById('next').onclick = showRandomCard;

  loadCards();
  </script>
</body>
</html>
