<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Hanzi Writer</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <h1 class="title">Hanzi Writer by JACTPCL</h1>

<form class="js-char-form char-form">
  <label for="char-input" class="form-label">Character(s)</label>
  <div class="form-row">
    <textarea id="char-input" 
          class="js-char char-input" 
          rows="3" 
          cols="20" 
          maxlength="200"
          placeholder="Escribe caracteres aquí..."></textarea>
    <button type="submit" id="Update">🔎</button>
  </div>
</form>

  <div id="translations"></div>
  <div id="target"></div>
  <script type="application/javascript" src="test.js"></script>
</body>
</html>
