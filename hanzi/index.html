<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Hanzi Writer</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <h1 class="title">Hanzi Writer by JACTPCL</h1>

  <form class="js-char-form char-form">
    <label for="char-input" class="form-label">Character(s)</label>
    <div class="form-row">
      <textarea id="char-input" 
            class="js-char char-input" 
            rows="3" 
            cols="20" 
            maxlength="200"
            placeholder="Escribe caracteres aquí...">我爱你</textarea>  
      <button type="submit" id="Update">🔎</button>
    </div>
  </form>

  <div class="form-container">
    <div class="steps-indicator">
      <div data-step="0" class="step_title active">👂 Escuchar</div>
      <div data-step="1" class="step_title">✍️ Practicar</div>
      <div data-step="2" class="step_title">🗣️ Hablar</div>
    </div>

    <form id="multiStepForm">
      <div id="translations" class="step active"></div>
      <div id="target" class="step"></div>

      <div class="step">
        <h2>Frase objetivo:</h2>
        <p id="target_object"></p>

        <button id="startBtn">🎤 Empezar a hablar</button>
        <p><b>Reconocido:</b> <span id="result"></span></p>
        <p><b>Evaluación:</b> <span id="feedback"></span></p>
        <p class="progress" id="progress"></p>
      </div>

      <div class="buttons">
        <button type="button" id="prevBtn" disabled><</button>
        <button type="button" id="nextBtn">></button>
      </div>
    </form>
  </div>
  <script type="application/javascript" src="test.js"></script>
</body>
</html>
